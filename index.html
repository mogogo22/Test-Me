function tqInit(){if(TQ.on)return;TQ.on=true;firebase.database().ref('tour').limitToLast(15).on('value',s=>{TQ.T=s.val()||{};tqPaint()})}
function tqMatch(T,mid,ps,t0,now){
  const qs=(T.qs&&T.qs[mid])||[],A=(T.ans&&T.ans[mid])||{},sc={},rs=[],n=Math.min(TQ_R,qs.length);sc[ps[0]]=0;sc[ps[1]]=0;
  let st=t0,lastRe=t0;
  for(let r=0;r<n;r++){
    if(now<st){rs.push({r,st,up:true});return{ps,sc,rs,winner:null,end:null}}
    const q=D.questions.find(x=>x.id===qs[r]);if(!q)continue;
    const a=A['r'+r]||{},val=ps.map(p=>a[p]&&a[p].t<=st+TQ_T?{p,c:a[p].c,t:a[p].t}:null).filter(Boolean),ok=val.filter(x=>x.c===q.ans).sort((x,y)=>x.t-y.t);
    let w=null,re;
    if(ok.length){w=ok[0].p;re=ok[0].t}else if(val.length===2)re=Math.max(val[0].t,val[1].t);else re=st+TQ_T+TQ_GRACE;
    if(now<re+TQ_SET){rs.push({r,st,q,a:val,live:true});return{ps,sc,rs,winner:null,end:null}}
    rs.push({r,st,q,a:val,w,re});lastRe=re;if(w)sc[w]++;
    if(w&&sc[w]>=TQ_WIN)return{ps,sc,rs,winner:w,end:re};
    st=re+TQ_GAP}
  const win=sc[ps[1]]>sc[ps[0]]?ps[1]:ps[0];
  return{ps,sc,rs,winner:win,end:lastRe}}
function tqState(T,now){const o=T.order;if(T.status!=='play'||!T.start||!Array.isArray(o)||o.length!==4)return null;
  const ma=tqMatch(T,'a',[o[0],o[1]],T.start+3000,now),mb=tqMatch(T,'b',[o[2],o[3]],T.start+3000,now);
  let f=null;if(ma.winner&&mb.winner)f=tqMatch(T,'f',[ma.winner,mb.winner],Math.max(ma.end,mb.end)+5000,now);
  return{ma,mb,f,champ:f&&f.winner,doneAt:f&&f.end}}
function tqMine(){const now=tqNow();let best=null;
  for(const id of Object.keys(TQ.T).sort()){const T=TQ.T[id];if(!T||!T.status||!(T.players&&T.players[S.user]))continue;
    if(T.status==='lobby'){if(now-(T.created||now)<40*60000)best=id;continue}
    const s=tqState(T,now);if(!s)continue;if(s.champ&&now>s.doneAt+60000)continue;if(now-T.start>40*60000)continue;best=id}
  return best}

function tqJoin(id){if(tqMine())return toast('إنت جوه بطولة فعلًا');

function tqStart(id,names){const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const pool=D.questions.map(q=>q.id),mk=()=>{let o=[];while(o.length<TQ_R)o=o.concat(sh(pool));return o.slice(0,TQ_R)};
  firebase.database().ref('tour/'+id).update({order:sh(names),qs:{a:mk(),b:mk(),f:mk()},start:firebase.database.ServerValue.TIMESTAMP,status:'play'})}

function rpOpen(list,note){const w=window.open('','_blank');if(!w)return alert('اسمح بالنوافذ المنبثقة (Pop-ups) عشان يفتح التقرير.');
  w.document.write('<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تقرير</title><style>*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{font-family:Tahoma,Arial,sans-serif;margin:0;color:#10203a;background:#fff}.pg{width:100%;max-width:780px;margin:0 auto;padding:28px;page-break-after:always}.pg:last-child{page-break-after:auto}.hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0b7fd4;padding-bottom:12px;margin-bottom:16px}h1{margin:0;font-size:26px}.nm2{font-size:20px;font-weight:700;color:#0b7fd4;margin-top:4px}.lg2{font-family:monospace;font-size:22px;font-weight:800;color:#7c3aed}.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:8px}.kp div{border:1px solid #d6e0f2;border-radius:10px;padding:10px;text-align:center;background:#f5f8fd}.kp b{display:block;font-size:18px}.kp span{font-size:12px;color:#5a6b8c}h2{font-size:16px;margin:18px 0 8px;border-inline-start:4px solid #0b7fd4;padding-inline-start:8px}.tr{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}.tr span{width:34%}.bb{flex:1;height:10px;background:#e8eef8;border-radius:99px;overflow:hidden}.bb i{display:block;height:100%}.wq{border:1px solid #f0c7cb;background:#fff6f6;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}.wq small{display:block;color:#888}.mu{color:#5a6b8c;font-size:12px;margin-top:4px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #d6e0f2;padding:6px 8px;text-align:right}th{background:#f5f8fd}.nt{border:1px dashed #7c3aed;border-radius:8px;padding:10px;white-space:pre-wrap;font-size:14px}.ft{margin-top:20px;font-size:11px;color:#8a98b3;text-align:center}@media print{.pg{padding:10px}}</style></head><body>'+list.map(u=>stuRep(u,note)).join('')+'</body></html>');
  w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},500)}
function rpOne(){const u=D.users[($('#rpS')||{}).value];if(u)rpOpen([u],($('#rpN')||{}).value||'')}
function rpAll(){const l=stu().sort((a,b)=>a.name.localeCompare(b.name));if(l.length)rpOpen(l,($('#rpN')||{}).value||'')}
/* ===== الخروج 3 مرات + تصحيح أسهل ===== */
var XOUT=false,XGR=0,XDN={};
function exEnter(id){XG[id]=1;XOUT=false;XGR=Date.now()+2500;const k=id+'|'+S.user;if(!(XS[k]&&XS[k].j))exRef('exsub/'+id+'/'+S.user+'/j').set(exNow());exFsOn();render()}
function exViol(){
  if(!XL||!XG[XL]||XQ||XDN[XL]||XOUT||Date.now()<XGR)return;
  XOUT=true;const id=XL,e=EX[id],mx=e.maxLeave||3;
  exWarn(0,mx);
  exRef('exsub/'+id+'/'+S.user+'/lv').transaction(v=>(v||0)+1).then(r=>{
    const n=r.snapshot.val()||0;
    if(n>=mx){exLocked(id,mx);exSubmit(id,'leave');return}
    if(XOUT)exWarn(n,mx)}).catch(()=>{})}
function exWarn(n,mx){let o=$('#xw');if(o)o.remove();o=document.createElement('div');o.id='xw';
  o.style.cssText='position:fixed;inset:0;z-index:10050;background:rgba(120,0,0,.95);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-size:20px;font-weight:700';
  o.innerHTML='<div>⚠️ خرجت من شاشة الامتحان!</div><div>'+(n?'المرة '+n+' من '+mx+'. المدرس شايف ده.<br>لو وصلت '+mx+' الامتحان هيتسلّم تلقائيًا وماتقدرش تكمل.':'بنسجّل الخروج…')+'</div><button id="xwb" style="font-size:18px">ارجع للامتحان</button>';
  document.body.appendChild(o);
  $('#xwb').onclick=()=>{o.remove();XOUT=false;XGR=Date.now()+2000;exFsOn()}}
function exLocked(id,mx){XDN[id]=1;XOUT=true;const w=$('#xw');if(w)w.remove();exFsOff();
  const o=document.createElement('div');o.id='xdone';
  o.style.cssText='position:fixed;inset:0;z-index:10060;background:#7a0010;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;font-size:20px;font-weight:700';
  o.innerHTML='<div style="font-size:52px">🔒</div><div>خرجت من الامتحان '+mx+' مرات</div><div>امتحانك اتسلّم تلقائيًا ومش هتقدر تكمّل.</div><button id="xdb" style="font-size:18px">تمام</button>';
  document.body.appendChild(o);
  $('#xdb').onclick=()=>{if(XL){toast('استنى لحد ما التسليم يتأكد…',1);return}o.remove()}}
function exSubmit(id,auto,sure){if(XQ)return;const k=id+'|'+S.user;if(XS[k]&&XS[k].done)return;
  if(!auto&&!sure){exAsk(id);return}
  const m={},b='exsub/'+id+'/'+S.user+'/';for(const i in XA[id]||{})m[b+'a/'+i]=XA[id][i];m[b+'done']=true;m[b+'at']=exNow();if(auto)m[b+'auto']=auto;
  firebase.database().ref().update(m).then(()=>toast(auto==='leave'?'🔒 اتسلّم امتحانك تلقائيًا':auto?'⏰ اتسلّم امتحانك تلقائيًا':'✅ اتسلّم امتحانك')).catch(()=>toast('⚠️ فشل التسليم، اتأكد من النت'))}
function exLock(){if(!S.user||!me()||me().teacher)return null;let r=null;for(const id in EX){if(EX[id].st!=='live')continue;const k=id+'|'+S.user;if(!XW[k]){XW[k]=1;exRef('exsub/'+id+'/'+S.user).on('value',x=>{XS[k]=x.val();exRefresh()})}
  const s=XS[k];if(s&&!s.done&&(s.lv||0)>=(EX[id].maxLeave||3)&&!XDN[id]){XDN[id]=1;exSubmit(id,'leave');continue}
  if(s!==undefined&&!(s&&s.done)&&!r)r=id}return r}
function exPick(id,qi,oi){if(XDN[id])return;XA[id][qi]=oi;exRef('exsub/'+id+'/'+S.user+'/a/'+qi).set(oi);document.querySelectorAll('[data-q="'+qi+'"]').forEach(b=>b.classList.toggle('xsel',+b.dataset.o===oi));exProg(id)}
function exTxt(id,qi,v){if(XDN[id])return;XA[id][qi]=v;exProg(id);clearTimeout(XD[qi]);XD[qi]=setTimeout(()=>exRef('exsub/'+id+'/'+S.user+'/a/'+qi).set(v),500)}

/* ---- تصحيح أسهل ---- */
const exGL=id=>{const e=EX[id],S2=EXS[id]||{};return Object.values(D.users).filter(u=>!u.teacher&&S2[u.name]&&(S2[u.name].done||e.st==='ended')).map(u=>u.name).sort((a,b)=>a.localeCompare(b))};
const exGd=(e,s)=>e.qs.every((q,i)=>q.t==='mcq'||(s.g||{})[i]!=null);
function exGNext(id,from){const L=exGL(id),S2=EXS[id]||{},st=L.indexOf(from);for(let k=1;k<=L.length;k++){const n=L[(st+k+L.length)%L.length];if(!exGd(EX[id],S2[n]))return n}return null}
function exGGo(n){S.xg=n;render()}
function exGMove(id,d){const L=exGL(id),n=L[L.indexOf(S.xg)+d];if(n)exGGo(n)}
function exGDone(id){const s=(EXS[id]||{})[S.xg]||{};if(!exGd(EX[id],s)){toast('لسه فيه سؤال ما اتصححش في ورقة '+S.xg,1);return}
  const nx=exGNext(id,S.xg);if(nx&&nx!==S.xg)exGGo(nx);else{S.xg=null;toast('🎉 خلّصت تصحيح كل الطلاب');render()}}
function exQG(id,n,i,v,max){exG(id,n,i,v,max);const y=scrollY;render();scrollTo(0,y)}
function exGrade(id,n){const e=EX[id],K=EXK[id]||{},S2=EXS[id]||{},s=S2[n]||{},a=s.a||{},L=exGL(id),ix=L.indexOf(n),ng=L.filter(x=>exGd(e,S2[x])).length;
  const q1=(i,v,max,cur,lab)=>'<button class="ghost sm'+(cur!=null&&+cur===v?' xsel':'')+'" onclick="exQG(\''+id+'\',\''+n+'\','+i+','+v+','+max+')">'+lab+'</button>';
  const nav='<div class="row" style="align-items:center;gap:8px;margin-bottom:10px"><button class="ghost sm"'+(ix>0?'':' disabled')+' onclick="exGMove(\''+id+'\',-1)">→ السابق</button><select style="flex:1;min-width:140px" onchange="exGGo(this.value)">'+L.map(x=>'<option value="'+esc(x)+'"'+(x===n?' selected':'')+'>'+(exGd(e,S2[x])?'✅ ':'⬜ ')+esc(x)+'</option>').join('')+'</select><button class="ghost sm"'+(ix<L.length-1?'':' disabled')+' onclick="exGMove(\''+id+'\',1)">التالي ←</button></div><div class="exprog" style="margin-bottom:10px"><i style="width:'+(L.length?Math.round(ng/L.length*100):0)+'%"></i></div>';
  const body=e.qs.map((q,i)=>{const v=a[i],g=(s.g||{})[i];let b;
    if(q.t==='mcq'){const ok=v!=null&&+v===+K[i];b='<div>'+(v==null?'<span class="mute">ما جاوبش</span>':esc(q.o[v])+(ok?' ✅':' ❌ <span class="mute">(الصح: '+esc(q.o[K[i]])+')</span>'))+'</div><b>'+(ok?q.m:0)+' / '+q.m+'</b> <span class="mute">(تلقائي)</span>'}
    else b='<div class="excode">'+(v?esc(v):'ما جاوبش')+'</div>'+(q.t==='code'&&v?'<div class="row"><button class="ghost sm" onclick="exRunStu(\''+id+'\',\''+n+'\','+i+')">▶ شغّل كود الطالب</button></div><div data-ok="rv|'+n+'|x'+i+'">'+(OUT['rv|'+n+'|x'+i]||'')+'</div>':'')+'<div class="row" style="align-items:center;margin-top:8px">'+q1(i,q.m,q.m,g,'✅ كامل ('+q.m+')')+q1(i,exRnd(q.m/2),q.m,g,'½ ('+exRnd(q.m/2)+')')+q1(i,0,q.m,g,'❌ صفر')+'<label class="exm">أو اكتب <input type="number" step="0.25" min="0" max="'+q.m+'" value="'+(g==null?'':g)+'" onchange="exG(\''+id+'\',\''+n+'\','+i+',this.value,'+q.m+')"></label><span class="mute">من '+q.m+'</span></div>';
    const un=q.t!=='mcq'&&g==null;
    return '<div class="exq" id="xq'+i+'"'+(un?' style="border-color:var(--bad)"':'')+'><div class="exq-h"><span class="exnum">'+(i+1)+'</span><span class="tag">'+exTn[q.t]+'</span>'+(un?'<span class="chip">لسه ما اتصححش</span>':'')+'</div><div style="margin-bottom:8px">'+fmt(q.x)+'</div>'+b+'</div>'}).join('');
  return '<div class="card"><h3>إجابات '+esc(n)+' <span class="mute">('+(ix+1)+' من '+L.length+')</span></h3>'+nav+body+'<div class="row" style="align-items:center;margin-top:12px"><div class="chip" style="font-size:16px">المجموع: <span id="xtot">'+exScore(e,K,s).t+'</span> / '+e.total+'</div><span class="sp"></span><button class="ghost" onclick="S.xg=null;render()">رجوع للقائمة</button><button onclick="exGDone(\''+id+'\')">✅ تمام — الطالب التالي</button></div></div>'}
function exMon(id){const e=EX[id],K=EXK[id]||{},S2=EXS[id]||{},st=Object.values(D.users).filter(u=>!u.teacher).sort((a,b)=>a.name.localeCompare(b.name)),L=exGL(id);let nr=0,nd=0,nv=0,ng=0;
  const rows=st.map(u=>{const s=S2[u.name];if(s){s.done?nd++:nr++;nv+=s.lv||0}const can=s&&(s.done||e.st==='ended'),gd=can&&exGd(e,s);if(gd)ng++;
    return '<tr><td>'+(BC_P[u.name]?'🟢':'⚪')+' '+esc(u.name)+'</td><td><span class="exst '+(!s?'':s.done?'ended':'run')+'">'+(!s?'لم يدخل':s.done?(s.auto==='leave'?'سلّم تلقائي (خروج)':'سلّم'):'بيمتحن')+'</span></td><td>'+(s&&s.a?Object.keys(s.a).length:0)+'/'+e.qs.length+'</td><td><span class="exv '+(s&&s.lv?'bad':'')+'">'+((s&&s.lv)||0)+'</span></td><td>'+(s?'<b>'+exScore(e,K,s).t+'</b> / '+e.total:'-')+'</td><td>'+(can?'<button class="'+(gd?'ghost ':'')+'sm" onclick="exGGo(\''+u.name+'\')">'+(gd?'✅ متصحح':'✍️ صحّح')+'</button>':'')+'</td></tr>'}).join('');
  return (S.xg&&S2[S.xg]?exGrade(id,S.xg):'')+'<div class="card"><h3>📊 '+esc(e.title)+'</h3><div class="exsum"><span class="chip">👥 '+st.length+' طالب</span><span class="chip">✍️ بيمتحنوا '+nr+'</span><span class="chip">✅ سلّموا '+nd+'</span><span class="chip">⚠️ مخالفات '+nv+'</span><span class="chip">📝 اتصحح '+ng+' من '+L.length+'</span></div>'
  +(L.length?'<div class="row" style="margin:10px 0"><button onclick="exGGo(exGNext(\''+id+'\',null)||exGL(\''+id+'\')[0])">'+(ng?'▶ كمّل التصحيح':'▶ ابدأ التصحيح')+'</button></div>':'')
  +(e.st==='ended'?'<div class="row" style="margin:10px 0">'+(e.pub?'<button class="ghost sm" onclick="exPub(\''+id+'\',1)">🔄 تحديث النتايج</button><button class="del sm" onclick="exPub(\''+id+'\',0)">🙈 إخفاء النتايج</button>':'<button onclick="exPub(\''+id+'\',1)">📢 إظهار النتائج</button>')+'</div>':'')
  +'<div class="exscroll"><table><tr><th>الطالب</th><th>الحالة</th><th>أجاب</th><th>خروج</th><th>الدرجة</th><th>التصحيح</th></tr>'+rows+'</table></div></div>'}
async function exPub(id,on){if(on){const e=EX[id],S2=EXS[id]||{},left=exGL(id).filter(x=>!exGd(e,S2[x])).length;if(left&&!await ask('لسه '+left+' طالب ما اتصححوش، ودرجاتهم هتظهر ناقصة. تكمل؟'))return;if(!await ask('تظهر النتايج لكل الطلاب؟'))return}
  const e=EX[id],K=EXK[id]||{},S2=EXS[id]||{},res={};if(on)for(const n in S2)res[n]=exScore(e,K,S2[n]).t;exRef('exams/'+id).update({pub:!!on,res:on?res:null}).then(()=>toast(on?'✅ النتايج ظهرت للطلاب':'🙈 النتايج اتخفت'))}
  DB.init().then(()=>{restore();render();DB.listen()});
</script>
